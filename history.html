<!DOCTYPE html>
<html class="dark" lang="zh-TW">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>VocabFill — History & Practice Review</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "canvas-black": "#000000",
            "surface-glass-subtle": "rgba(255, 255, 255, 0.04)",
            "surface-glass-medium": "rgba(255, 255, 255, 0.08)",
            "surface-glass-elevated": "rgba(255, 255, 255, 0.15)",
            "border-glass-hairline": "rgba(255, 255, 255, 0.15)",
            "border-glass-active": "rgba(255, 255, 255, 0.3)",
            "border-glass-focus": "rgba(255, 255, 255, 0.5)",
            "feedback-success": "#10b981",
            "feedback-success-glass": "rgba(16, 185, 129, 0.18)",
            "feedback-error": "#ef4444",
            "feedback-error-glass": "rgba(239, 68, 68, 0.2)",
            "primary": "#ffffff",
            "on-primary": "#000000",
            "on-surface": "#e2e2e2",
            "on-surface-variant": "#c4c7c8",
            "text-dim": "#737373"
          },
          fontFamily: {
            "body-default": ["Geist", "sans-serif"],
            "headline-sm": ["Geist", "sans-serif"],
            "headline-lg": ["Geist", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body { margin:0; padding:0; }
      body { overscroll-behavior:none; }
    }
    ::-webkit-scrollbar { display:none; }
  </style>
</head>
<body class="bg-canvas-black font-body-default text-on-surface antialiased min-h-screen">
  
  <!-- Fixed Header -->
  <header class="fixed top-0 inset-x-0 z-50 bg-black/60 backdrop-blur-2xl">
    <div class="h-20 max-w-[1000px] mx-auto px-4 md:px-8 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a class="flex items-center gap-2 group" href="generate.html">
          <div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center transition-transform group-hover:scale-95">
            <span class="material-symbols-outlined text-black text-[15px]">edit_square</span>
          </div>
          <span class="font-headline-sm text-[1.15rem] font-bold text-primary tracking-tight">VocabFill</span>
        </a>
        <nav class="hidden md:flex items-center gap-1 p-1 bg-surface-glass-subtle rounded-full backdrop-blur-md">
          <a class="px-4 py-1.5 rounded-full font-label-md text-on-surface-variant hover:text-primary transition-all" href="generate.html">Generator</a>
          <a class="px-4 py-1.5 rounded-full font-label-md text-on-surface-variant hover:text-primary transition-all" href="practice.html">Practice</a>
          <a aria-current="page" class="px-4 py-1.5 rounded-full font-label-md bg-surface-glass-medium text-primary shadow-[0_0_16px_rgba(255,255,255,0.08)] font-semibold" href="history.html">History</a>
        </nav>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 pl-2 pr-4 py-1 rounded-full bg-surface-glass-subtle backdrop-blur-md">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-black font-bold text-sm" id="nav-user-initial">
            U
          </div>
          <div class="hidden sm:flex flex-col text-left">
            <span class="text-xs text-primary font-semibold leading-none" id="nav-user-name">User</span>
            <span class="text-[10px] text-text-dim leading-none mt-0.5">Scholar</span>
          </div>
        </div>
        <button id="logout-btn" class="px-4 py-1.5 rounded-full text-xs text-on-surface-variant hover:text-primary hover:bg-surface-glass-medium bg-surface-glass-subtle backdrop-blur-md transition-all">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="w-full pt-20 bg-canvas-black h-screen overflow-hidden">
    <div class="max-w-[1360px] mx-auto px-4 md:px-8 h-full flex flex-col">

      <!-- Header -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-4 border-b border-border-glass-hairline/40 shrink-0">
        <div>
          <div class="flex items-center gap-2 text-text-dim text-xs font-mono">
            <span class="w-2 h-2 rounded-full bg-feedback-success shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
            <span>Analytics &amp; Review</span>
            <span>/</span>
            <span>Study Archive</span>
          </div>
          <h1 class="text-xl md:text-2xl font-extrabold text-primary tracking-tight mt-0.5">
            練習記錄與個人化複習
          </h1>
        </div>
        <a href="generate.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold text-black bg-white hover:bg-neutral-200 transition-all shadow-sm">
          <span class="material-symbols-outlined text-[15px]">add</span>
          <span>建立新練習</span>
        </a>
      </div>

      <!-- Dual-Column Layout: Left Analytics Sidebar + Right Sessions Stage (Independent Scrolling) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-1 h-full overflow-hidden py-4">

        <!-- LEFT SIDEBAR: Metrics & Weak Words (col-span-4, Independent Scrollable) -->
        <aside class="lg:col-span-4 h-full overflow-y-auto pr-1 flex flex-col gap-3">
          
          <!-- 3 Stats Stack Card (Compact & Shortened) -->
          <div class="p-3.5 md:p-4 rounded-xl bg-surface-glass-subtle backdrop-blur-2xl border border-border-glass-hairline shadow-xl flex flex-col gap-2.5">
            <div class="flex items-center justify-between pb-2 border-b border-border-glass-hairline/60">
              <div class="flex items-center gap-1.5">
                <span class="material-symbols-outlined text-primary text-[17px]">query_stats</span>
                <h2 class="text-xs md:text-sm font-bold text-primary tracking-wide">學習數據概覽</h2>
              </div>
              <span class="text-[9px] text-text-dim font-mono uppercase bg-white/5 px-1.5 py-0.5 rounded">All Sessions</span>
            </div>

            <!-- Compact 3-Column Stats Grid -->
            <div class="grid grid-cols-3 gap-1.5">
              <div class="p-2 rounded-lg bg-surface-glass-medium border border-border-glass-hairline flex flex-col items-center text-center justify-center">
                <span class="text-[10px] text-text-dim font-medium leading-none">總練習</span>
                <div class="text-base md:text-lg font-bold text-primary font-mono mt-1" id="stat-total-exercises">--</div>
              </div>

              <div class="p-2 rounded-lg bg-surface-glass-medium border border-border-glass-hairline flex flex-col items-center text-center justify-center">
                <span class="text-[10px] text-text-dim font-medium leading-none">正確率</span>
                <div class="text-base md:text-lg font-bold text-feedback-success font-mono mt-1" id="stat-avg-accuracy">--%</div>
              </div>

              <div class="p-2 rounded-lg bg-surface-glass-medium border border-border-glass-hairline flex flex-col items-center text-center justify-center">
                <span class="text-[10px] text-text-dim font-medium leading-none">弱點詞</span>
                <div class="text-base md:text-lg font-bold text-feedback-error font-mono mt-1" id="stat-missed-count">--</div>
              </div>
            </div>
          </div>

          <!-- Minimal Missed Words Section (Compact) -->
          <div id="missed-words-section" class="hidden p-3.5 md:p-4 rounded-xl bg-surface-glass-subtle backdrop-blur-2xl border border-border-glass-hairline shadow-xl flex flex-col gap-2.5">
            <div class="flex items-center justify-between pb-1.5 border-b border-border-glass-hairline/60">
              <div class="flex items-center gap-1.5">
                <span class="material-symbols-outlined text-feedback-error text-[16px]">priority_high</span>
                <h2 class="text-xs font-bold text-primary">高頻易錯單字</h2>
              </div>
              <span class="text-[10px] text-text-dim" id="missed-words-count-label"></span>
            </div>

            <button id="btn-practice-weak-words" type="button" class="w-full py-2 px-3 rounded-full bg-white text-black hover:bg-neutral-200 text-xs font-bold transition-all shadow-[0_0_12px_rgba(255,255,255,0.25)] flex items-center justify-center gap-1.5 cursor-pointer">
              <span class="material-symbols-outlined text-[15px] text-amber-500">bolt</span>
              <span>練習常錯弱點單字</span>
            </button>

            <div class="flex flex-wrap gap-1.5 pt-0.5 max-h-[140px] overflow-y-auto" id="missed-words-container">
              <!-- Dynamically inserted missed word tags -->
            </div>
          </div>

        </aside>

        <!-- RIGHT SESSIONS MAIN STAGE (col-span-8, Independent Scrollable) -->
        <section class="lg:col-span-8 h-full overflow-y-auto pr-1 pb-16 flex flex-col gap-4">
          <div class="flex items-center justify-between pb-2 border-b border-border-glass-hairline/60">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-[20px]">history</span>
              <h2 class="text-base font-bold text-primary">歷史練習時間軸</h2>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/10 text-text-dim" id="sessions-count-badge">0</span>
            </div>
          </div>

          <div class="space-y-3" id="sessions-container">
            <div class="p-8 text-center text-text-dim text-sm rounded-2xl bg-surface-glass-subtle border border-border-glass-hairline">
              載入歷史記錄中...
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth, logout, getMyExercises } from "./firebase-config.js";
    import { saveToSession, showToast, formatDate, initTextSelectionTranslator } from "./app.js";
    import { buildOptions } from "./gemini.js";

    // 啟動反白文字即時翻譯與單字庫收錄功能
    initTextSelectionTranslator();

    requireAuth((user) => {
      const nameEl = document.getElementById("nav-user-name");
      const initialEl = document.getElementById("nav-user-initial");
      if (nameEl) nameEl.textContent = user.displayName || user.email.split('@')[0];
      if (initialEl) initialEl.textContent = (user.displayName || user.email)[0].toUpperCase();
      loadUserAnalytics();
    });

    document.getElementById("logout-btn")?.addEventListener("click", (e) => {
      e.preventDefault();
      logout().then(() => window.location.href = "index.html");
    });

    async function loadUserAnalytics() {
      const sessionsContainer = document.getElementById("sessions-container");
      const statTotalEl = document.getElementById("stat-total-exercises");
      const statAvgEl = document.getElementById("stat-avg-accuracy");
      const statMissedEl = document.getElementById("stat-missed-count");
      const sessionsCountBadge = document.getElementById("sessions-count-badge");
      const missedSection = document.getElementById("missed-words-section");
      const missedContainer = document.getElementById("missed-words-container");
      const missedLabel = document.getElementById("missed-words-count-label");

      try {
        const exercises = await getMyExercises();

        if (!exercises || exercises.length === 0) {
          if (sessionsContainer) {
            sessionsContainer.innerHTML = `
              <div class="p-12 text-center text-text-dim text-sm rounded-2xl bg-surface-glass-subtle border border-border-glass-hairline flex flex-col items-center gap-3">
                <span class="material-symbols-outlined text-3xl opacity-40">history_edu</span>
                <p>目前尚無任何練習紀錄。前往出題頁開始第一次挑戰吧！</p>
                <a href="generate.html" class="mt-2 px-5 py-2 rounded-full bg-white text-black text-xs font-semibold hover:bg-neutral-200 transition-all">
                  開始出題練習
                </a>
              </div>
            `;
          }
          if (statTotalEl) statTotalEl.textContent = "0";
          if (statAvgEl) statAvgEl.textContent = "0%";
          if (statMissedEl) statMissedEl.textContent = "0";
          if (sessionsCountBadge) sessionsCountBadge.textContent = "0";
          return;
        }

        // 1. 計算頂部核心統計數值
        const totalExercises = exercises.length;
        let sumPct = 0;
        const missedFrequency = {};

        exercises.forEach(item => {
          const pct = item.score ? item.score.pct : (item.pct || 0);
          sumPct += pct;

          if (item.incorrectWords && Array.isArray(item.incorrectWords)) {
            item.incorrectWords.forEach(w => {
              const cleanWord = String(w).trim().toLowerCase();
              if (cleanWord) {
                missedFrequency[cleanWord] = (missedFrequency[cleanWord] || 0) + 1;
              }
            });
          }
        });

        const avgAccuracy = Math.round(sumPct / totalExercises);
        const uniqueMissedWords = Object.keys(missedFrequency);

        if (statTotalEl) statTotalEl.textContent = String(totalExercises);
        if (statAvgEl) statAvgEl.textContent = `${avgAccuracy}%`;
        if (statMissedEl) statMissedEl.textContent = String(uniqueMissedWords.length);
        if (sessionsCountBadge) sessionsCountBadge.textContent = String(totalExercises);

        // 2. 渲染精簡常錯單字標籤（依答錯次數由大到小排序）
        const sortedMissed = uniqueMissedWords.sort((a, b) => missedFrequency[b] - missedFrequency[a]);

        // 功能 A：全域弱點一鍵出題（頂部「強化所有歷史錯題」按鈕）
        const btnPracticeWeak = document.getElementById("btn-practice-weak-words");
        if (btnPracticeWeak) {
          btnPracticeWeak.onclick = () => {
            if (sortedMissed.length === 0) {
              showToast("目前沒有任何錯題記錄，表現優異！");
              return;
            }
            // 撈出累計答錯次數最高的前 5~10 個單字
            const topWeakWords = sortedMissed.slice(0, 8);
            sessionStorage.setItem("prefillWords", JSON.stringify(topWeakWords));
            sessionStorage.setItem("autoGenerate", "true");
            showToast(`正在根據 ${topWeakWords.length} 個歷史常錯單字啟動全新出題...`);
            setTimeout(() => {
              window.location.href = "generate.html";
            }, 300);
          };
        }

        if (uniqueMissedWords.length > 0 && missedSection && missedContainer) {
          missedSection.classList.remove("hidden");
          if (missedLabel) missedLabel.textContent = `(${sortedMissed.length} 個單字)`;
          
          missedContainer.innerHTML = "";
          sortedMissed.slice(0, 15).forEach(word => {
            const count = missedFrequency[word];
            const tagBtn = document.createElement("button");
            tagBtn.type = "button";
            tagBtn.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-feedback-error-glass text-feedback-error border border-feedback-error/30 hover:bg-feedback-error hover:text-white transition-all";
            tagBtn.title = `曾答錯 ${count} 次，點擊複製單字`;
            tagBtn.innerHTML = `
              <span>${word}</span>
              <span class="text-[10px] opacity-75 font-mono">(${count})</span>
            `;
            tagBtn.addEventListener("click", () => {
              navigator.clipboard?.writeText(word);
              showToast(`已複製單字 "${word}" 至剪貼簿！`);
            });
            missedContainer.appendChild(tagBtn);
          });
        }

        // 3. 渲染扁平化歷史卡片清單
        if (sessionsContainer) {
          sessionsContainer.innerHTML = "";
          exercises.forEach((item, itemIdx) => {
            const scorePct = item.score ? item.score.pct : (item.pct || 0);
            const correctCount = item.score ? item.score.correct : (item.correctCount || 0);
            const totalCount = item.score ? item.score.total : (item.totalCount || 0);
            const itemMissed = (item.incorrectWords && Array.isArray(item.incorrectWords)) 
              ? item.incorrectWords.filter(w => Boolean(String(w).trim()))
              : [];
            
            // 日期格式化：使用短格式
            let dateText = "Recent";
            if (item.createdAt) {
              const rawDate = item.createdAt.toDate ? item.createdAt.toDate() : item.createdAt;
              dateText = formatDate(rawDate);
            }

            // 單字標籤預覽：取前 4 個，超過顯示 +N
            const words = item.words || [];
            const displayWords = words.slice(0, 4);
            const moreCount = words.length - displayWords.length;

            const card = document.createElement("div");
            card.className = "p-4 md:p-5 rounded-2xl bg-surface-glass-subtle hover:bg-surface-glass-medium border border-border-glass-hairline transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4";
            
            const hasMissed = itemMissed.length > 0;

            card.innerHTML = `
              <div class="flex flex-col gap-2 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold font-mono ${
                    scorePct >= 80 
                      ? 'bg-feedback-success-glass text-feedback-success border border-feedback-success/30' 
                      : 'bg-feedback-error-glass text-feedback-error border border-feedback-error/30'
                  }">
                    ${correctCount}/${totalCount} (${scorePct}%)
                  </span>
                  <span class="text-xs text-text-dim">${dateText}</span>
                  <span class="text-xs text-text-dim">•</span>
                  <span class="text-xs text-text-dim font-medium">${item.lang === 'zh' ? '中文' : '英文'}練習</span>
                  ${hasMissed ? `<span class="px-2 py-0.5 rounded-full text-[11px] bg-feedback-error-glass text-feedback-error font-medium">${itemMissed.length} 題未答對</span>` : ''}
                </div>

                <div class="flex items-center gap-1.5 flex-wrap">
                  ${displayWords.map(w => `<span class="px-2.5 py-0.5 rounded-full text-xs bg-white/5 border border-white/10 text-on-surface">${w}</span>`).join("")}
                  ${moreCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-xs text-text-dim bg-white/5">+${moreCount}</span>` : ""}
                </div>
              </div>

              <div class="flex items-center gap-2 shrink-0 self-end sm:self-center flex-wrap">
                <!-- 功能 B：針對此篇錯題重新出題 -->
                <button type="button" class="btn-derive-new px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1 ${
                  hasMissed 
                    ? 'bg-primary/10 text-primary border border-border-glass-active hover:bg-primary/20' 
                    : 'opacity-40 text-text-dim bg-white/5 border border-white/10 cursor-not-allowed'
                }" data-idx="${itemIdx}" ${!hasMissed ? 'disabled title="全數答對，無需重練"' : 'title="使用本次答錯的單字生成新測驗"'}>
                  <span class="material-symbols-outlined text-[14px]">psychology</span>
                  <span>${hasMissed ? '針對此篇錯題重新出題' : '全數答對無需重練'}</span>
                </button>

                <!-- 既有：舊題重做 -->
                <button type="button" class="btn-practice-again px-3.5 py-1.5 rounded-full bg-white text-black hover:bg-neutral-200 text-xs font-semibold transition-all shadow-sm flex items-center gap-1" data-idx="${itemIdx}">
                  <span class="material-symbols-outlined text-[14px]">refresh</span>
                  <span>Practice Again</span>
                </button>
              </div>
            `;

            // 綁定「🎯 針對此篇錯題重新出題」
            if (hasMissed) {
              card.querySelector('.btn-derive-new')?.addEventListener('click', () => {
                sessionStorage.setItem("prefillWords", JSON.stringify(itemMissed));
                sessionStorage.setItem("autoGenerate", "true");
                showToast(`已載入本篇 ${itemMissed.length} 個錯字，正前往重新出題...`);
                setTimeout(() => {
                  window.location.href = "generate.html";
                }, 300);
              });
            }

            // 綁定「Practice Again」舊題原樣重做
            card.querySelector('.btn-practice-again').addEventListener('click', () => {
              const exerciseData = buildOptions({
                words: item.words || [],
                lang: item.lang || 'en',
                difficulty: item.difficulty || 'middle',
                selectedTypes: item.selectedTypes || ['article', 'sentence', 'spelling'],
                articles: item.articles || [],
                sentences: item.sentences || []
              });
              saveToSession('currentExercise', exerciseData);
              window.location.href = 'practice.html';
            });

            sessionsContainer.appendChild(card);
          });
        }
      } catch (err) {
        console.error("載入歷史分析失敗:", err);
        if (sessionsContainer) {
          sessionsContainer.innerHTML = '<div class="p-8 text-center text-feedback-error text-xs">載入歷史紀錄發生錯誤，請稍後重試。</div>';
        }
      }
    }
  </script>
</body>
</html>
