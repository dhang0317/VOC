<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>填空練習 - 單字填空練習</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Stars -->
  <div class="stars-bg" id="stars-bg"></div>

  <!-- Nav -->
  <nav>
    <a class="nav-brand" href="index.html">單字填空</a>
    <div class="nav-links">
      <a href="generate.html">出題</a>
      <a href="history.html">紀錄</a>
    </div>
    <div class="nav-user">
      <img class="nav-avatar" id="nav-avatar" src="" alt="" style="display:none;" />
      <span id="nav-user-name"></span>
      <button class="btn btn-secondary" id="logout-btn" style="padding:6px 14px;font-size:0.82rem;">登出</button>
    </div>
  </nav>

  <!-- Modal: pick option for a blank -->
  <div class="modal-overlay" id="blank-modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-context"></div>
      <div class="modal-options" id="modal-options"></div>
      <button class="btn modal-option modal-cancel" id="modal-cancel" style="margin-top:10px;">取消</button>
    </div>
  </div>

  <div class="container" style="padding-top: 30px;">

    <!-- Tabs -->
    <div class="tabs" id="main-tabs">
      <button class="tab-btn active" data-tab="article">文章填空</button>
      <button class="tab-btn"        data-tab="sentence">句子填空 (選擇)</button>
      <button class="tab-btn"        data-tab="spelling">造句填空 (首尾字母手寫)</button>
    </div>

    <!-- ── Article tab ─────────────────────── -->
    <div id="tab-article">
      <div id="articles-container">
        <!-- Dynamically generated -->
      </div>
    </div>

    <!-- ── Sentence tab ─────────────────────── -->
    <div id="tab-sentence" style="display:none;">
      <div id="sentences-container">
        <!-- Dynamically generated -->
      </div>
    </div>

    <!-- ── Spelling tab (首尾字母手寫) ───────── -->
    <div id="tab-spelling" style="display:none;">
      <div id="spelling-container">
        <!-- Dynamically generated -->
      </div>
    </div>

    <!-- ── Submit & Result ─────────────────── -->
    <div id="submit-area" style="margin-top:8px;">
      <button class="btn btn-primary" id="submit-btn" style="width:100%;justify-content:center;padding:14px;">
        提交答案
      </button>
    </div>

    <div id="result-area" style="display:none; margin-top:16px;">
      <div class="card">
        <div class="card-title">練習結果</div>
        <div class="score-text" id="score-display">0 / 0</div>
        <div class="score-bar"><div class="score-fill" id="score-fill" style="width:0%"></div></div>
        <p id="score-msg" style="color:var(--text-secondary);margin:12px 0 20px;"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-primary"   id="save-btn">儲存紀錄</button>
          <a href="generate.html" class="btn btn-secondary">再出一題</a>
          <button class="btn btn-secondary" id="review-btn">查看詳解</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { requireAuth, initLogoutBtn, initStars, showToast, loadFromSession, saveToSession, DIFFICULTY_LABELS, LANG_LABELS, formatDate } from "./app.js";
    import { saveExercise } from "./firebase-config.js";

    initStars();
    initLogoutBtn();
    await requireAuth();

    // ── Load exercise data ─────────────────
    const exerciseData = loadFromSession("currentExercise");
    if (!exerciseData) {
      showToast("找不到題目資料，請重新出題", "error");
      setTimeout(() => window.location.href = "generate.html", 2000);
    }

    // ── State ──────────────────────────────
    const articleAnswers  = {}; // articleIndex -> { blankIndex: word }
    const sentenceAnswers = {}; // sentGroupIndex -> { itemIndex: word }
    const spellingAnswers = {}; // sentGroupIndex -> { itemIndex: word }
    let submitted = false;

    // ── Tab switching ──────────────────────
    document.getElementById("main-tabs").querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.getElementById("tab-article").style.display  = tab === "article"  ? "block" : "none";
        document.getElementById("tab-sentence").style.display = tab === "sentence" ? "block" : "none";
        document.getElementById("tab-spelling").style.display = tab === "spelling" ? "block" : "none";
      });
    });

    // ── Modal ──────────────────────────────
    const modal        = document.getElementById("blank-modal");
    const modalContext = document.getElementById("modal-context");
    const modalOptions = document.getElementById("modal-options");
    let   currentBlankCb = null;

    function openModal(contextText, options, onSelect) {
      modalContext.textContent = contextText;
      modalOptions.innerHTML = "";
      currentBlankCb = onSelect;

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "modal-option";
        btn.textContent = opt;
        btn.addEventListener("click", () => {
          closeModal();
          onSelect(opt);
        });
        modalOptions.appendChild(btn);
      });

      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
      currentBlankCb = null;
    }

    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

    // ── Build article blanks ───────────────
    function buildArticles() {
      const container = document.getElementById("articles-container");
      if (!exerciseData.articles || exerciseData.articles.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有文章題目</div>';
        return;
      }

      exerciseData.articles.forEach((article, aIdx) => {
        articleAnswers[aIdx] = {};

        const card = document.createElement("div");
        card.className = "card";

        // Title
        const titleDiv = document.createElement("div");
        titleDiv.className = "card-title";
        titleDiv.innerHTML = `文章 ${aIdx + 1}`;
        card.appendChild(titleDiv);

        // ── 文章專屬上方單字選取列 (毛玻璃方塊) ──
        const optionBar = document.createElement("div");
        optionBar.style.cssText = "background:rgba(255,255,255,0.04); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.14); border-radius:12px; padding:12px 14px; margin-bottom:16px;";
        optionBar.innerHTML = `
          <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
            <span>點選單字再點空格，或先點空格再點單字：</span>
            <span class="active-status" style="color:#ffffff; font-weight:bold; font-size:0.85rem;">未選取</span>
          </div>
          <div class="card-chips" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        `;
        const chipsContainer = optionBar.querySelector(".card-chips");
        const statusSpan = optionBar.querySelector(".active-status");

        let selectedWord = null;
        let selectedBlankIndex = null;

        function updateChipsUI() {
          chipsContainer.querySelectorAll(".clickable-chip").forEach(chip => {
            if (chip.dataset.word === selectedWord) {
              chip.classList.add("active-selection");
            } else {
              chip.classList.remove("active-selection");
            }
          });
          if (selectedWord) {
            statusSpan.textContent = `已選單字：${selectedWord} (請點擊空格填入)`;
          } else if (selectedBlankIndex !== null) {
            statusSpan.textContent = `已選空格 (第 ${selectedBlankIndex + 1} 格，請點擊上方單字填入)`;
          } else {
            statusSpan.textContent = "未選取";
          }
        }

        function fillBlank(bIdx, word) {
          articleAnswers[aIdx][bIdx] = word;
          const blankEl = document.getElementById(`blank-a${aIdx}-${bIdx}`);
          if (blankEl) {
            blankEl.textContent = word;
            blankEl.classList.remove("selected");
            blankEl.classList.add("filled");
          }
          selectedWord = null;
          selectedBlankIndex = null;
          card.querySelectorAll(".blank").forEach(b => b.classList.remove("selected"));
          updateChipsUI();
        }

        (article.options || []).forEach(w => {
          const chip = document.createElement("div");
          chip.className = "clickable-chip";
          chip.dataset.word = w;
          chip.textContent = w;
          chip.addEventListener("click", () => {
            if (submitted) return;
            // 如果此時已經選定了某個空格，點擊單字立刻填入！
            if (selectedBlankIndex !== null) {
              fillBlank(selectedBlankIndex, w);
              return;
            }
            // 否則切換單字選取狀態
            if (selectedWord === w) {
              selectedWord = null;
            } else {
              selectedWord = w;
            }
            updateChipsUI();
          });
          chipsContainer.appendChild(chip);
        });

        card.appendChild(optionBar);

        // Build text with blanks
        const articleTextDiv = document.createElement("div");
        articleTextDiv.className = "article-text";
        let html = buildArticleHTML(article, aIdx);
        articleTextDiv.innerHTML = html;
        card.appendChild(articleTextDiv);

        // 詳解區塊（預設隱藏）
        const expDiv = document.createElement("div");
        expDiv.className = "explanation-box";
        expDiv.id = `exp-article-${aIdx}`;
        expDiv.style.display = "none";
        const formattedExp = (article.explanation || "本篇文章考驗目標單字在段落上下文中的搭配與詞性使用。")
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean)
          .map(line => `<div style="margin-bottom:6px;">${line}</div>`)
          .join("");
        expDiv.innerHTML = `
          <div class="explanation-title">單字翻譯與文章詳解</div>
          <div style="line-height:1.8; color:var(--text-secondary);">${formattedExp}</div>
        `;
        card.appendChild(expDiv);

        container.appendChild(card);

        // Attach blank click events
        article.blanks.forEach((blank, bIdx) => {
          const blankEl = document.getElementById(`blank-a${aIdx}-${bIdx}`);
          if (!blankEl) return;

          blankEl.addEventListener("click", (e) => {
            if (submitted) return;

            // 1. 若已經有選取單字，點擊空格立刻填入
            if (selectedWord) {
              fillBlank(bIdx, selectedWord);
              return;
            }

            // 2. 若點擊的是已經填過的空格，再次點擊可以清除該空格
            if (articleAnswers[aIdx][bIdx]) {
              delete articleAnswers[aIdx][bIdx];
              blankEl.innerHTML = `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
              blankEl.classList.remove("filled");
              blankEl.classList.remove("selected");
              if (selectedBlankIndex === bIdx) selectedBlankIndex = null;
              updateChipsUI();
              return;
            }

            // 3. 若未選單字，切換空格選取狀態（高亮提示）
            if (selectedBlankIndex === bIdx) {
              selectedBlankIndex = null;
              blankEl.classList.remove("selected");
            } else {
              card.querySelectorAll(".blank").forEach(b => b.classList.remove("selected"));
              selectedBlankIndex = bIdx;
              blankEl.classList.add("selected");
            }
            updateChipsUI();
          });
        });
      });
    }

    function buildArticleHTML(article, aIdx) {
      let text = article.text || "";
      const blanks = article.blanks || [];

      // 情況 A：如果 AI 在文章 text 裡已經直接寫入了 ___BLANK___ 或 [blank] 或 ______
      const blankPlaceholderRegex = /_{3,}BLANK_{3,}|\[blank\]|___+/gi;
      let placeholderCount = 0;
      if (blankPlaceholderRegex.test(text)) {
        text = text.replace(blankPlaceholderRegex, () => {
          const bIdx = placeholderCount++;
          const targetWord = (blanks[bIdx] && blanks[bIdx].word) || (article.targetWords && article.targetWords[bIdx]) || "";
          return `<span class="blank" id="blank-a${aIdx}-${bIdx}" data-word="${targetWord}">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
        });
      } else {
        // 情況 B：AI 回傳完整文章，依照 blanks 單字逐一挖空
        blanks.forEach((blank, bIdx) => {
          const word = (blank.word || "").trim();
          if (!word) return;

          // 判斷是否為英文單字（包含純英文字母與連字號）
          const isEnglish = /^[A-Za-z\-]+$/.test(word);
          let regex;
          if (isEnglish) {
            regex = new RegExp(`\\b${escapeRegex(word)}\\b`, "i");
          } else {
            regex = new RegExp(escapeRegex(word), "");
          }

          const replacement = `<span class="blank" id="blank-a${aIdx}-${bIdx}" data-word="${word}">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
          if (regex.test(text)) {
            text = text.replace(regex, replacement);
          } else {
            const fallbackRegex = new RegExp(escapeRegex(word), "i");
            text = text.replace(fallbackRegex, replacement);
          }
        });
      }

      // 雙重保險：確保絕不殘留任何未被替換的 ___BLANK___ 原始字串
      text = text.replace(/_{2,}BLANK_{2,}|_{3,}/gi, `<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);

      // 支援多段落排版：若有換行符號，轉為清晰的段落間距
      const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
      if (paragraphs.length > 1) {
        return paragraphs.map(p => `<p style="margin-bottom:14px; line-height:2.2;">${p}</p>`).join("");
      }
      return `<p style="line-height:2.2;">${text}</p>`;
    }

    // ── Build sentence blanks ──────────────
    function buildSentences() {
      const container = document.getElementById("sentences-container");
      if (!exerciseData.sentences || exerciseData.sentences.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有句子題目</div>';
        return;
      }

      exerciseData.sentences.forEach((sentGroup, sIdx) => {
        sentenceAnswers[sIdx] = {};

        const wordCard = document.createElement("div");
        wordCard.className = "card";

        const titleDiv = document.createElement("div");
        titleDiv.className = "card-title";
        titleDiv.innerHTML = `單字：<span class="word-tag">${sentGroup.word}</span>`;
        wordCard.appendChild(titleDiv);

        const items = sentGroup.items || [];
        items.forEach((item, iIdx) => {
          sentenceAnswers[sIdx][iIdx] = null;

          const itemDiv = document.createElement("div");
          itemDiv.className = "sentence-item";

          // ── 句子專屬上方單字選取列 (毛玻璃方塊) ──
          const sentOptBar = document.createElement("div");
          sentOptBar.style.cssText = "background:rgba(255,255,255,0.04); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:8px 12px; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;";
          sentOptBar.innerHTML = `<span style="font-size:0.85rem; color:var(--text-muted); margin-right:4px;">點選單字填入：</span>`;
          
          let activeSentWord = null;
          const blankId = `blank-s${sIdx}-${iIdx}`;

          function fillSentenceBlank(word) {
            sentenceAnswers[sIdx][iIdx] = word;
            const blankEl = document.getElementById(blankId);
            if (blankEl) {
              blankEl.textContent = word;
              blankEl.classList.remove("selected");
              blankEl.classList.add("filled");
            }
            activeSentWord = null;
            sentOptBar.querySelectorAll(".clickable-chip").forEach(c => c.classList.remove("active-selection"));
          }

          (item.options || []).forEach(w => {
            const chip = document.createElement("div");
            chip.className = "clickable-chip";
            chip.style.padding = "6px 14px";
            chip.style.fontSize = "0.9rem";
            chip.textContent = w;
            chip.addEventListener("click", () => {
              if (submitted) return;
              fillSentenceBlank(w);
            });
            sentOptBar.appendChild(chip);
          });

          itemDiv.appendChild(sentOptBar);

          // Sentence with blank
          const sentTextDiv = document.createElement("div");
          sentTextDiv.className = "sentence-text";
          let sentHtml = item.sentence;
          const sentBlankRegex = /_{2,}BLANK_{2,}|\[blank\]|___+/gi;
          if (sentBlankRegex.test(sentHtml)) {
            sentHtml = sentHtml.replace(
              sentBlankRegex,
              `<span class="blank" id="${blankId}" data-word="${sentGroup.word}">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`
            );
          } else {
            // 如果 AI 沒有放 ___BLANK___ 而是寫了目標單字，將目標單字轉為空格
            const wRegex = new RegExp(`\\b${escapeRegex(sentGroup.word)}\\b`, "i");
            sentHtml = sentHtml.replace(
              wRegex,
              `<span class="blank" id="${blankId}" data-word="${sentGroup.word}">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`
            );
          }
          sentTextDiv.innerHTML = `${iIdx + 1}. ${sentHtml}`;
          itemDiv.appendChild(sentTextDiv);

          // 詳解區塊（預設隱藏）
          const expDiv = document.createElement("div");
          expDiv.className = "explanation-box";
          expDiv.id = `exp-sent-${sIdx}-${iIdx}`;
          expDiv.style.display = "none";
          const formattedSentExp = (item.explanation || `「${sentGroup.word}」為本題正確答案，符合句型語意與文法要求。`)
            .split("\n")
            .map(line => line.trim())
            .filter(Boolean)
            .map(line => `<div style="margin-bottom:6px;">${line}</div>`)
            .join("");
          expDiv.innerHTML = `
            <div class="explanation-title">單字翻譯與解析</div>
            <div style="line-height:1.8; color:var(--text-secondary);">${formattedSentExp}</div>
          `;
          itemDiv.appendChild(expDiv);

          wordCard.appendChild(itemDiv);

          // Attach click to clear or show modal
          setTimeout(() => {
            const blankEl = document.getElementById(blankId);
            if (!blankEl) return;
            blankEl.addEventListener("click", () => {
              if (submitted) return;
              // 若已填入，點擊可清除
              if (sentenceAnswers[sIdx][iIdx]) {
                sentenceAnswers[sIdx][iIdx] = null;
                blankEl.innerHTML = `&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`;
                blankEl.classList.remove("filled");
                blankEl.classList.remove("selected");
                return;
              }
              // 也可以開啟彈窗選擇
              openModal(
                `選擇正確的單字填入空格：`,
                item.options,
                word => {
                  fillSentenceBlank(word);
                }
              );
              blankEl.classList.add("selected");
            });
          }, 0);
        });

        container.appendChild(wordCard);
      });
    }

    // ── Build spelling sentences (挖空保留首尾字母，無選項，自行輸入) ──
    function buildSpellingSentences() {
      const container = document.getElementById("spelling-container");
      if (!exerciseData.sentences || exerciseData.sentences.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有造句題目</div>';
        return;
      }

      exerciseData.sentences.forEach((sentGroup, sIdx) => {
        spellingAnswers[sIdx] = {};

        const wordCard = document.createElement("div");
        wordCard.className = "card";

        const titleDiv = document.createElement("div");
        titleDiv.className = "card-title";
        titleDiv.innerHTML = `造句單字：<span class="word-tag">${sentGroup.word}</span> <span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal; margin-left:8px;">(請依首尾字母提示自行拼出單字)</span>`;
        wordCard.appendChild(titleDiv);

        const items = sentGroup.items || [];
        items.forEach((item, iIdx) => {
          spellingAnswers[sIdx][iIdx] = "";

          const itemDiv = document.createElement("div");
          itemDiv.className = "sentence-item";

          const sentTextDiv = document.createElement("div");
          sentTextDiv.className = "sentence-text";

          const targetWord = (sentGroup.word || "").trim();
          const wLen = targetWord.length;
          let firstLetter = "", lastLetter = "";
          let middleLen = 3;

          if (wLen <= 2) {
            firstLetter = targetWord[0] || "";
            lastLetter = targetWord[wLen - 1] || "";
            middleLen = 1;
          } else {
            firstLetter = targetWord[0];
            lastLetter = targetWord[wLen - 1];
            middleLen = wLen - 2;
          }

          const spellInputId = `spell-input-s${sIdx}-${iIdx}`;
          const spellWrapId = `spell-wrap-s${sIdx}-${iIdx}`;
          const inputWidth = Math.max(30, middleLen * 14);

          const spellingWidget = `
            <span class="spell-blank-wrapper" id="${spellWrapId}">
              <span class="spell-hint-letter">${firstLetter}</span>
              <input type="text" class="spell-input" id="${spellInputId}" placeholder="${'_'.repeat(middleLen)}" style="width:${inputWidth}px;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
              <span class="spell-hint-letter">${lastLetter}</span>
            </span>
          `;

          let sentHtml = item.sentence;
          const sentBlankRegex = /_{2,}BLANK_{2,}|\[blank\]|___+/gi;
          if (sentBlankRegex.test(sentHtml)) {
            sentHtml = sentHtml.replace(sentBlankRegex, spellingWidget);
          } else {
            const wRegex = new RegExp(`\\b${escapeRegex(targetWord)}\\b`, "i");
            sentHtml = sentHtml.replace(wRegex, spellingWidget);
          }
          sentTextDiv.innerHTML = `${iIdx + 1}. ${sentHtml}`;
          itemDiv.appendChild(sentTextDiv);

          // 詳解區塊（預設隱藏）
          const expDiv = document.createElement("div");
          expDiv.className = "explanation-box";
          expDiv.id = `exp-spell-${sIdx}-${iIdx}`;
          expDiv.style.display = "none";
          const formattedSentExp = (item.explanation || `「${sentGroup.word}」為本題正確答案，符合句型語意與文法要求。`)
            .split("\n")
            .map(line => line.trim())
            .filter(Boolean)
            .map(line => `<div style="margin-bottom:6px;">${line}</div>`)
            .join("");
          expDiv.innerHTML = `
            <div class="explanation-title">單字翻譯與解析</div>
            <div style="line-height:1.8; color:var(--text-secondary);">${formattedSentExp}</div>
          `;
          itemDiv.appendChild(expDiv);

          wordCard.appendChild(itemDiv);

          setTimeout(() => {
            const inp = document.getElementById(spellInputId);
            if (!inp) return;
            inp.addEventListener("input", (e) => {
              const middleVal = e.target.value.trim();
              spellingAnswers[sIdx][iIdx] = firstLetter + middleVal + lastLetter;
            });
          }, 0);
        });

        container.appendChild(wordCard);
      });
    }

    // ── Submit & grade ─────────────────────
    document.getElementById("submit-btn").addEventListener("click", () => {
      if (submitted) return;

      let correct = 0, total = 0;
      const incorrectWordsList = new Set();

      // Grade articles
      exerciseData.articles.forEach((article, aIdx) => {
        (article.blanks || []).forEach((blank, bIdx) => {
          total++;
          const blankEl = document.getElementById(`blank-a${aIdx}-${bIdx}`);
          const given   = articleAnswers[aIdx][bIdx];
          const answer  = blank.word;
          const trans   = blank.translation ? ` (${blank.translation})` : "";

          if (given && given.toLowerCase() === answer.toLowerCase()) {
            correct++;
            if (blankEl) {
              blankEl.className = "blank correct";
              if (trans) {
                const transSpan = document.createElement("span");
                transSpan.className = "reveal-translation";
                transSpan.textContent = trans;
                blankEl.insertAdjacentElement("afterend", transSpan);
              }
            }
          } else {
            incorrectWordsList.add(answer);
            if (blankEl) {
              blankEl.className = "blank wrong";
              const revealSpan = document.createElement("span");
              revealSpan.className = "reveal-answer";
              revealSpan.textContent = ` 正解: ${answer}${trans}`;
              blankEl.insertAdjacentElement("afterend", revealSpan);
            }
          }
        });
        const expEl = document.getElementById(`exp-article-${aIdx}`);
        if (expEl) expEl.style.display = "block";
      });

      // Grade sentences (選擇)
      exerciseData.sentences.forEach((sentGroup, sIdx) => {
        (sentGroup.items || []).forEach((item, iIdx) => {
          total++;
          const blankEl = document.getElementById(`blank-s${sIdx}-${iIdx}`);
          const given   = sentenceAnswers[sIdx][iIdx];
          const answer  = sentGroup.word;
          const trans   = sentGroup.translation ? ` (${sentGroup.translation})` : "";

          if (given && given.toLowerCase() === answer.toLowerCase()) {
            correct++;
            if (blankEl) {
              blankEl.className = "blank correct";
              if (trans) {
                const transSpan = document.createElement("span");
                transSpan.className = "reveal-translation";
                transSpan.textContent = trans;
                blankEl.insertAdjacentElement("afterend", transSpan);
              }
            }
          } else {
            incorrectWordsList.add(answer);
            if (blankEl) {
              blankEl.className = "blank wrong";
              const revealSpan = document.createElement("span");
              revealSpan.className = "reveal-answer";
              revealSpan.textContent = ` 正解: ${answer}${trans}`;
              blankEl.insertAdjacentElement("afterend", revealSpan);
            }
          }
          const expEl = document.getElementById(`exp-sent-${sIdx}-${iIdx}`);
          if (expEl) expEl.style.display = "block";
        });
      });

      // Grade spelling (首尾字母手寫填空)
      exerciseData.sentences.forEach((sentGroup, sIdx) => {
        (sentGroup.items || []).forEach((item, iIdx) => {
          const wrapEl = document.getElementById(`spell-wrap-s${sIdx}-${iIdx}`);
          const inpEl  = document.getElementById(`spell-input-s${sIdx}-${iIdx}`);
          const answer = (sentGroup.word || "").trim();
          const trans  = sentGroup.translation ? ` (${sentGroup.translation})` : "";
          const given  = (spellingAnswers[sIdx] && spellingAnswers[sIdx][iIdx] || "").trim();

          if (inpEl) inpEl.disabled = true;

          if (given && given.toLowerCase() === answer.toLowerCase()) {
            if (wrapEl) {
              wrapEl.className = "spell-blank-wrapper correct";
              if (trans) {
                const transSpan = document.createElement("span");
                transSpan.className = "reveal-translation";
                transSpan.textContent = trans;
                wrapEl.insertAdjacentElement("afterend", transSpan);
              }
            }
          } else {
            if (wrapEl) {
              wrapEl.className = "spell-blank-wrapper wrong";
              const revealSpan = document.createElement("span");
              revealSpan.className = "reveal-answer";
              revealSpan.textContent = ` 正解: ${answer}${trans}`;
              wrapEl.insertAdjacentElement("afterend", revealSpan);
            }
          }
          const expEl = document.getElementById(`exp-spell-${sIdx}-${iIdx}`);
          if (expEl) expEl.style.display = "block";
        });
      });

      submitted = true;
      showResult(correct, total, Array.from(incorrectWordsList));
    });

    async function showResult(correct, total, incorrectWords) {
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      document.getElementById("submit-area").style.display = "none";
      document.getElementById("result-area").style.display = "block";
      document.getElementById("score-display").textContent = `${correct} / ${total}`;
      document.getElementById("score-fill").style.width = pct + "%";

      let msg = "";
      if      (pct === 100) msg = "全對！太優秀了！已為您自動儲存至雲端學習紀錄。";
      else if (pct >= 80)   msg = "表現很好！詳解已顯示在下方供複習，已自動儲存至雲端。";
      else if (pct >= 60)   msg = "還不錯！查看下方詳解鞏固記憶，已自動儲存至雲端。";
      else                  msg = "多看下方詳解，再練習一次一定會進步！已自動儲存至雲端。";
      document.getElementById("score-msg").textContent = msg;

      const result = {
        ...exerciseData,
        score: { correct, total, pct },
        incorrectWords: incorrectWords || [],
        completedAt: new Date().toISOString()
      };
      saveToSession("lastResult", result);

      // ── 自動儲存至雲端 (免按按鈕) ──────────
      const saveBtn = document.getElementById("save-btn");
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "自動儲存中...";
      }
      try {
        await saveExercise(result);
        if (saveBtn) saveBtn.textContent = "已自動儲存";
        showToast("答題結果已自動同步至雲端紀錄！", "success");
      } catch (err) {
        console.warn("Auto save failed:", err);
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = "手動重試儲存";
        }
      }
    }

    // 手動重試備用
    document.getElementById("save-btn").addEventListener("click", async () => {
      const result = loadFromSession("lastResult") || {};
      try {
        const btn = document.getElementById("save-btn");
        btn.disabled = true;
        btn.textContent = "儲存中...";
        await saveExercise(result);
        showToast("已手動儲存到雲端！", "success");
        btn.textContent = "已儲存";
      } catch (e) {
        showToast("儲存失敗：" + e.message, "error");
        document.getElementById("save-btn").disabled = false;
        document.getElementById("save-btn").textContent = "手動重試儲存";
      }
    });

    document.getElementById("review-btn").addEventListener("click", () => {
      window.scrollTo({ top: 120, behavior: "smooth" });
    });

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    if (exerciseData) {
      buildArticles();
      buildSentences();
      buildSpellingSentences();
    }
  </script>
</body>
</html>
