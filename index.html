<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字填空練習 - 登入</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Stars background -->
  <div class="stars-bg" id="stars-bg"></div>

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html" class="nav-brand">✨ VocabFill</a>
    <div class="nav-links">
      <a href="generate.html">開始出題</a>
      <a href="practice.html">練習區</a>
      <a href="history.html">歷史紀錄</a>
    </div>
  </nav>

  <div class="container" style="padding-top: 0;">
    <div class="hero" style="padding-top: 8px; padding-bottom: 20px;">
      <h1 class="hero-title" style="margin-top: 0; margin-bottom: 8px;">單字填空練習</h1>
      <p class="hero-subtitle" style="margin-bottom: 16px;">輸入單字，AI 幫你生成文章與句子填空題<br>讓背單字變得有趣又有效率！</p>

      <!-- Quick Action Buttons -->
      <div style="display:flex; justify-content:center; gap:12px; margin-bottom: 24px; flex-wrap: wrap;">
        <a href="generate.html" class="btn btn-primary" style="padding: 10px 24px; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
          🚀 直接體驗出題 (跳過登入)
        </a>
        <a href="history.html" class="btn btn-secondary" style="padding: 10px 20px; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
          📖 瀏覽練習紀錄
        </a>
      </div>

      <div id="login-section">
        <div class="card" style="max-width: 380px; margin: 0 auto; text-align: left;">
          <div class="tabs" style="margin-bottom: 16px;">
            <button class="tab-btn active" id="tab-login-btn" type="button">登入</button>
            <button class="tab-btn" id="tab-register-btn" type="button">註冊帳號</button>
          </div>

          <form id="auth-form" onsubmit="return false;">
            <div class="form-group">
              <label class="form-label" for="auth-email">電子信箱 (Email)</label>
              <input type="email" id="auth-email" class="form-input" placeholder="student@example.com" required autocomplete="email" />
            </div>

            <div class="form-group">
              <label class="form-label" for="auth-password">密碼 (Password)</label>
              <input type="password" id="auth-password" class="form-input" placeholder="至少 6 位字元" required autocomplete="current-password" />
            </div>

            <button type="submit" class="btn btn-primary" id="email-auth-btn" style="width:100%; justify-content:center; margin-top:8px;">
              登入
            </button>
          </form>

          <div style="display:flex; align-items:center; gap:10px; margin: 18px 0;">
            <div style="flex:1; height:1px; background:var(--border-color);"></div>
            <span style="font-size:0.8rem; color:var(--text-muted);">或</span>
            <div style="flex:1; height:1px; background:var(--border-color);"></div>
          </div>

          <button type="button" class="btn btn-google" id="google-login-btn" style="width:100%; justify-content:center;">
            <img src="https://www.google.com/favicon.ico" alt="Google" style="width:18px;height:18px;" />
            使用 Google 帳號快速登入
          </button>
        </div>
        <p style="color: var(--text-muted); margin-top: 16px; font-size: 0.85rem;">
          登入後即可在 Firestore 雲端儲存練習紀錄
        </p>
      </div>

      <div id="logged-section" style="display:none;">
        <div class="card" style="max-width: 360px; margin: 0 auto 20px; text-align: left;">
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
            <img id="user-avatar" src="" alt="頭像" style="width:44px;height:44px;border-radius:50%;border:2px solid var(--accent-primary);display:none;" />
            <div id="user-avatar-placeholder" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;color:white;">👤</div>
            <div>
              <div id="user-name" style="font-weight:600;"></div>
              <div id="user-email" style="font-size:0.82rem;color:var(--text-muted);"></div>
            </div>
          </div>
          <div style="display:flex;gap:10px;">
            <a href="generate.html" class="btn btn-primary" style="flex:1;justify-content:center;">開始出題</a>
            <a href="history.html" class="btn btn-secondary" style="flex:1;justify-content:center;">歷史紀錄</a>
          </div>
        </div>
        <button class="btn btn-secondary" id="logout-btn-index" style="font-size:0.85rem;">登出</button>
      </div>
    </div>

    <!-- Features -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-top: 20px;">
      <div class="card" style="text-align:center;">
        <div style="font-weight:600; font-size:1.1rem; margin-bottom:6px;">文章填空</div>
        <div style="font-size:0.85rem; color:var(--text-muted);">AI 生成包含目標單字的完整文章，挖空考驗記憶</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-weight:600; font-size:1.1rem; margin-bottom:6px;">句子填空</div>
        <div style="font-size:0.85rem; color:var(--text-muted);">每個單字 3 個例句，點擊選項完成填空</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-weight:600; font-size:1.1rem; margin-bottom:6px;">雲端儲存</div>
        <div style="font-size:0.85rem; color:var(--text-muted);">練習紀錄自動儲存至 Firestore，隨時複習</div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { loginWithGoogle, loginWithEmail, registerWithEmail, onAuthChange, logout } from "./firebase-config.js";
    import { initStars, showToast } from "./app.js";

    initStars();

    let authMode = "login"; // "login" | "register"
    const tabLoginBtn    = document.getElementById("tab-login-btn");
    const tabRegisterBtn = document.getElementById("tab-register-btn");
    const emailAuthBtn   = document.getElementById("email-auth-btn");
    const authForm       = document.getElementById("auth-form");
    const emailInput     = document.getElementById("auth-email");
    const passwordInput  = document.getElementById("auth-password");

    tabLoginBtn.addEventListener("click", () => {
      authMode = "login";
      tabLoginBtn.classList.add("active");
      tabRegisterBtn.classList.remove("active");
      emailAuthBtn.textContent = "登入";
    });

    tabRegisterBtn.addEventListener("click", () => {
      authMode = "register";
      tabRegisterBtn.classList.add("active");
      tabLoginBtn.classList.remove("active");
      emailAuthBtn.textContent = "註冊並登入";
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showToast("請填寫 Email 與密碼", "error");
        return;
      }

      emailAuthBtn.disabled = true;
      try {
        if (authMode === "register") {
          await registerWithEmail(email, password);
          showToast("註冊成功並已登入！", "success");
        } else {
          await loginWithEmail(email, password);
          showToast("登入成功！", "success");
        }
      } catch (err) {
        let msg = err.message;
        if (err.code === "auth/email-already-in-use") msg = "此 Email 已被註冊，請直接登入";
        else if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") msg = "帳號或密碼錯誤";
        else if (err.code === "auth/weak-password") msg = "密碼強度不足，請輸入至少 6 位字元";
        else if (err.code === "auth/invalid-email") msg = "無效的 Email 格式";
        showToast(msg, "error");
      } finally {
        emailAuthBtn.disabled = false;
      }
    });

    onAuthChange(user => {
      if (user) {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("logged-section").style.display = "block";
        document.getElementById("user-name").textContent  = user.displayName || user.email.split("@")[0];
        document.getElementById("user-email").textContent = user.email;
        const avatar = document.getElementById("user-avatar");
        const placeholder = document.getElementById("user-avatar-placeholder");
        if (user.photoURL) {
          avatar.src = user.photoURL;
          avatar.style.display = "block";
          placeholder.style.display = "none";
        } else {
          avatar.style.display = "none";
          placeholder.style.display = "flex";
        }
      } else {
        document.getElementById("login-section").style.display = "block";
        document.getElementById("logged-section").style.display = "none";
      }
    });

    document.getElementById("google-login-btn").addEventListener("click", async () => {
      try { await loginWithGoogle(); }
      catch (e) { showToast("登入失敗：" + e.message, "error"); }
    });

    document.getElementById("logout-btn-index").addEventListener("click", async () => {
      await logout();
      showToast("已登出", "success");
    });
  </script>
</body>
</html>
